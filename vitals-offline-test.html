<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitals offline test widget</title>
<style>
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; padding: 12px; color: #1d2a33; background: #fff; }
  .status { font-size: 13px; padding: 8px 10px; border-left: 3px solid #5b7a8c; background: #f1f4f6; margin-bottom: 12px; line-height: 1.6; }
  .ok { color: #1b7f3b; font-weight: 600; }
  .bad { color: #b3261e; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  label { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  input { font-size: 16px; padding: 8px; border: 1px solid #a9b6bf; border-radius: 4px; width: 100px; }
  button { font-size: 16px; padding: 9px 16px; border: 0; border-radius: 4px; background: #1f5f8b; color: #fff; }
  button.secondary { background: #e3e8eb; color: #1d2a33; }
  button:focus-visible, input:focus-visible { outline: 2px solid #1f5f8b; outline-offset: 2px; }
  canvas { width: 100%; height: 200px; border: 1px solid #d5dde2; display: block; }
  ul { font-size: 13px; padding-left: 18px; margin: 8px 0 0; }
</style>
</head>
<body>
  <div class="status" id="status">Starting up…</div>

  <div class="row">
    <label>Time<input id="t" type="time"></label>
    <label>Heart rate<input id="hr" type="number" inputmode="numeric" min="0" max="300" placeholder="bpm"></label>
    <label>Systolic<input id="sys" type="number" inputmode="numeric" min="0" max="300" placeholder="mmHg"></label>
    <label>Diastolic<input id="dia" type="number" inputmode="numeric" min="0" max="250" placeholder="mmHg"></label>
    <button id="add" type="button">Add reading</button>
    <button id="clear" type="button" class="secondary">Clear all</button>
  </div>

  <canvas id="chart" aria-label="Heart rate trend"></canvas>
  <ul id="list"></ul>

  <!-- Jotform Custom Widget API. If this fails to load offline, the status box will say so. -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

  <script>
    var readings = [];
    var loadedAt = new Date().toLocaleTimeString();
    var apiLoaded = typeof JFCustomWidget !== "undefined";
    var formReady = false;

    function renderStatus() {
      document.getElementById("status").innerHTML =
        "Widget page loaded at " + loadedAt +
        "<br>Device connection: " + (navigator.onLine ? '<span class="ok">online</span>' : '<span class="bad">offline</span>') +
        "<br>Jotform widget API: " + (apiLoaded ? '<span class="ok">loaded</span>' : '<span class="bad">not loaded</span>') +
        "<br>Talking to the form: " + (formReady ? '<span class="ok">yes</span>' : '<span class="bad">not yet</span>');
    }

    function resize() {
      if (apiLoaded && formReady) {
        JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 10 });
      }
    }

    function sendValue() {
      if (apiLoaded && formReady) {
        JFCustomWidget.sendData({ value: JSON.stringify(readings) });
      }
    }

    function draw() {
      var c = document.getElementById("chart");
      var dpr = window.devicePixelRatio || 1;
      var w = c.clientWidth, h = c.clientHeight;
      c.width = w * dpr; c.height = h * dpr;
      var ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.font = "11px sans-serif";

      var pad = { l: 36, r: 14, t: 26, b: 24 };
      if (!readings.length) {
        ctx.fillStyle = "#5b7a8c";
        ctx.fillText("Add a reading to start the graph", pad.l, h / 2);
        return;
      }

      var series = [
        { key: "hr", label: "HR", color: "#b3261e" },
        { key: "sys", label: "SBP", color: "#1f5f8b" },
        { key: "dia", label: "DBP", color: "#7aa7cc" }
      ];
      var vals = [];
      readings.forEach(function (r) {
        series.forEach(function (s) { if (r[s.key] != null) vals.push(r[s.key]); });
      });
      var min = Math.max(0, Math.min.apply(null, vals) - 10);
      var max = Math.max.apply(null, vals) + 10;
      var pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
      function x(i) { return pad.l + (readings.length === 1 ? pw / 2 : i * pw / (readings.length - 1)); }
      function y(v) { return pad.t + ph - (v - min) / (max - min) * ph; }

      ctx.strokeStyle = "#e3e8eb"; ctx.fillStyle = "#5b7a8c"; ctx.lineWidth = 1;
      for (var g = 0; g <= 4; g++) {
        var v = min + (max - min) * g / 4, yy = y(v);
        ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(w - pad.r, yy); ctx.stroke();
        ctx.fillText(Math.round(v), 4, yy + 4);
      }

      series.forEach(function (s) {
        ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = 2;
        ctx.beginPath();
        var started = false;
        readings.forEach(function (r, i) {
          if (r[s.key] == null) return;
          started ? ctx.lineTo(x(i), y(r[s.key])) : ctx.moveTo(x(i), y(r[s.key]));
          started = true;
        });
        ctx.stroke();
        readings.forEach(function (r, i) {
          if (r[s.key] == null) return;
          ctx.beginPath(); ctx.arc(x(i), y(r[s.key]), 3.5, 0, Math.PI * 2); ctx.fill();
        });
      });

      var lx = pad.l;
      series.forEach(function (s) {
        ctx.fillStyle = s.color; ctx.fillRect(lx, 8, 14, 3);
        ctx.fillStyle = "#1d2a33"; ctx.fillText(s.label, lx + 18, 13);
        lx += 56;
      });

      ctx.fillStyle = "#5b7a8c";
      readings.forEach(function (r, i) { ctx.fillText(r.time, x(i) - 14, h - 6); });
    }

    function renderList() {
      document.getElementById("list").innerHTML = readings.map(function (r) {
        var parts = [];
        if (r.hr != null) parts.push("HR " + r.hr);
        if (r.sys != null || r.dia != null) parts.push("BP " + (r.sys != null ? r.sys : "–") + "/" + (r.dia != null ? r.dia : "–"));
        return "<li>" + r.time + " — " + parts.join(", ") + "</li>";
      }).join("");
    }

    function refresh() { draw(); renderList(); sendValue(); resize(); }

    function setNow() {
      var d = new Date();
      document.getElementById("t").value =
        String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    document.getElementById("add").addEventListener("click", function () {
      var t = document.getElementById("t").value;
      function num(id) {
        var v = parseInt(document.getElementById(id).value, 10);
        return isNaN(v) ? null : v;
      }
      var hr = num("hr"), sys = num("sys"), dia = num("dia");
      if (!t || (hr == null && sys == null && dia == null)) return;
      readings.push({ time: t, hr: hr, sys: sys, dia: dia });
      readings.sort(function (a, b) { return a.time.localeCompare(b.time); });
      ["hr", "sys", "dia"].forEach(function (id) { document.getElementById(id).value = ""; });
      setNow();
      refresh();
    });

    document.getElementById("clear").addEventListener("click", function () {
      readings = [];
      refresh();
    });

    window.addEventListener("online", renderStatus);
    window.addEventListener("offline", renderStatus);
    window.addEventListener("resize", draw);

    if (apiLoaded) {
      JFCustomWidget.subscribe("ready", function () {
        formReady = true;
        renderStatus();
        resize();
        JFCustomWidget.subscribe("submit", function () {
          JFCustomWidget.sendSubmit({ valid: true, value: JSON.stringify(readings) });
        });
      });
    }

    setNow();
    renderStatus();
    draw();
  </script>
</body>
</html>
